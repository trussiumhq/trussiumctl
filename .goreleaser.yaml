version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: trussiumctl
    main: ./cmd/trussiumctl
    ldflags:
      - -s -w -X github.com/trussiumhq/trussiumctl/internal/version.Version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - format: tar.gz

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^chore:'
      - '^docs:'
